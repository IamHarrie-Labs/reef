name: live desk

on:
  schedule:
    - cron: "34 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-desk
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: OpenTimestamps client
        run: pip install --quiet opentimestamps-client
      - name: Refresh, shadow desk, export, anchor
        run: python src/desk_cycle.py
      - name: Publish the cycle
        run: |
          git config user.name "reef-desk"
          git config user.email "reef-desk@users.noreply.github.com"
          # Include the consecutive evaluation artifacts generated by export_web.
          # desk_cycle.py writes data/, web/web_export.json and web/public/validation - add
          # everything there (-A, not a hand-maintained list) so a new output file,
          # like data/onchain/, can never again be silently left unstaged and block
          # the rebase below.
          git add -A -- data web/web_export.json web/public/validation
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -q -m "desk: cycle $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
