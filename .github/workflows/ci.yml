name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Financial accounting regression tests
        run: python src/test_accounting.py

      - name: Shadow desk and Bitcoin anchor, offline end to end
        run: python src/test_shadow.py

      - name: What-would-make-it-work solver
        run: python src/solve.py

      - name: On-chain gold check, offline decode/math tests
        run: python src/test_onchain_gold.py

      - name: Query parser regression tests
        run: python src/test_llm_parsing.py

      - name: Carry model + capacity curve run against cached data
        run: python src/capacity.py

      - name: Naive-vs-priced screen run against cached data
        run: python src/screen.py

      - name: Mirage index run against cached data
        run: python src/reef_index.py

      - name: Confidence intervals compute
        run: python src/intervals.py

      - name: Regime significance tests
        run: python src/regime_test.py

      - name: Edge decay across funding windows
        run: python src/edge_decay.py

      - name: Funding archive absorbs and reports coverage
        run: python src/funding_archive.py

      - name: Web export regenerates without error
        run: python src/export_web.py

      - name: Website evidence matches calculator
        run: python src/test_export_consistency.py

      - name: End-to-end demo walkthrough
        run: python src/demo.py

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install website dependencies
        working-directory: web
        run: npm ci
      - name: Type-check and build landing page and dashboard
        working-directory: web
        run: npm run build
